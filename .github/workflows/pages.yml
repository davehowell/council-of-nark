name: Build and publish experiment talks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install pinned presentation dependencies
        working-directory: presentations
        run: bun install --frozen-lockfile
      - name: Install PDF browser
        working-directory: presentations
        run: bunx playwright install --with-deps chromium
      - name: Verify published evidence and public-release audit
        run: |
          python3 scripts/evidence_audit.py
          python3 scripts/public_audit.py
      - name: Build all four web decks, fresh PDFs and speaker notes
        working-directory: presentations
        env:
          SITE_BASE: /${{ github.event.repository.name }}
        run: bun run site:build
      - name: Verify all 28 rendered slides and speaker-note pages
        working-directory: presentations
        run: node scripts/verify-slides.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: presentations/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
