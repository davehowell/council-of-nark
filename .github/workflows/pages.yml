name: Deploy experiment story to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install pinned presentation dependencies
        working-directory: presentations
        run: bun install --frozen-lockfile

      - name: Build landing page and Slidev decks
        working-directory: presentations
        env:
          SITE_BASE: /${{ github.event.repository.name }}
        run: bun run site:build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: presentations/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
